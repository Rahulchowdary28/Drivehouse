 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back - Under Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 550px;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .accent-bar {
            width: 50px;
            height: 4px;
            background-color: #3498db;
            margin: 0 auto 25px auto;
            border-radius: 2px;
        }

        .footer {
            font-size: 0.9rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Maintenance Icon -->
        <div class="icon">🛠️</div>
        
        <h1>We'll Be Right Back</h1>
        <div class="accent-bar"></div>
        
        <p>Our website is currently undergoing scheduled maintenance. We are hard at work behind the scenes upgrading our systems to significantly enhance your user experience.</p>
        
        <p>Thank you for your patience and understanding!</p>
        
        <div class="footer">
            &copy; 2026 DriveHouse.ae All rights reserved.
        </div>
    </div>

</body>
</html>
