<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivehouse | Tuning Our Systems</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            /* Subtle carbon-grid pattern */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 25px 25px;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Glassmorphism Performance Card */
        .card {
            text-align: center;
            max-width: 500px;
            background: rgba(15, 16, 22, 0.85);
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 75, 75, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 75, 75, 0.03);
        }

        /* Racing Red Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 75, 75, 0.1);
            color: #ff4b4b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 75, 75, 0.25);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4b4b;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.7);
            animation: pitstop-pulse 1.8s infinite;
        }

        @keyframes pitstop-pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(255, 75, 75, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 75, 75, 0);
            }
        }

        h1 {
            font-size: 2.4rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        h1 span {
            color: #ff4b4b;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .highlight {
            color: #ffffff;
            font-weight: 600;
        }

        /* Sleek Redline Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin: 35px 0;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #ff4b4b, #b30000);
            border-radius: 2px;
            animation: throttle 2.2s infinite ease-in-out;
        }

        @keyframes throttle {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        .footer {
            font-size: 0.85rem;
            color: #475569;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Pit Stop Status -->
        <div class="status-badge">
            <span class="pulse-dot"></span>
            Pit Stop / Upgrading Systems
        </div>
        
        <h1>Drivehouse<span>.ae</span></h1>
        
        <p>We are currently tuning our digital garage. Our team is working under the hood to deploy upgrades that will drastically <span class="highlight">enhance your user experience</span> and site performance.</p>
        
        <!-- Redline Throttle Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>
        
        <div class="footer">
            Back on the track shortly
        </div>
    </div>

</body>
</html>
